name: todo-application-bmad

services:
  backend:
    profiles: [test]
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/todo.db
    volumes:
      - type: tmpfs
        target: /data
        tmpfs:
          mode: 0777

  frontend:
    profiles: [test]
    build:
      context: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

  backend-dev:
    profiles: [dev]
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/todo.db
    volumes:
      - todo-data:/data
    networks:
      default:
        aliases:
          - backend

  frontend-dev:
    profiles: [dev]
    build:
      context: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend-dev:
        condition: service_healthy

volumes:
  todo-data:
