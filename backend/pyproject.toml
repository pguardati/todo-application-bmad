[project]
name = "todo-application-bmad-backend"
version = "0.1.0"
description = "Todo App backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "sqlmodel==0.0.39",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# pytest-cov's --cov-fail-under cannot fail the run under pytest 9 (it raises the
# count after the exit status is computed), so `coverage report` enforces the gate.
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 70
show_missing = true
